x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "512k"
    max-file: "1"

services:
  museum:
    image: ghcr.io/ente/server
    restart: unless-stopped
    volumes:
      - "$CONTAINER_DIR/logs:/var/logs"
      # https://github.com/ente-io/ente/blob/main/server/configurations/local.yaml
      - "$CONTAINER_DIR/museum.yaml:/museum.yaml:ro"
      - "$CONTAINER_DIR/credentials.yaml:/credentials.yaml:ro"
      - "$CONTAINER_DIR/data:/data:ro"
    depends_on:
      postgres:
        condition: service_healthy
      # Erst starten, wenn der Objektstore oben ist UND die Buckets existieren.
      minio:
        condition: service_healthy
    environment:
      # Pass-in the config to connect to the DB and the S3 store
      ENTE_CREDENTIALS_FILE: /credentials.yaml
    networks: [traefik, default]
    extra_hosts:
      - "${VIRTUAL_HOST_S3}:${S3_HOST_IP:-host-gateway}"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"

      - "traefik.http.routers.ente.entrypoints=websecure"
      - "traefik.http.routers.ente.rule=Host(`$VIRTUAL_HOST_API`)"
      - "traefik.http.routers.ente.service=ente"
      - "traefik.http.services.ente.loadbalancer.server.port=8080"

      - "backup.enable=true"
      - "backup.password=$RESTIC_PASSWORD"
      - "backup.volumes=$CONTAINER_DIR/data"
    logging: *default-logging

  web:
    image: ghcr.io/ente/web
    # Das web-Image bedient 3000 Photos, 3001 Accounts, 3002 Albums, 3003 Auth,
    # 3004 Cast, 3005 Share (Public Locker), 3006 Embed, 3008 Paste,
    # 3009 Locker, 3010 Memories. Routing laeuft komplett ueber Traefik.
    networks: [traefik, default]
    restart: unless-stopped
    environment:
      ENTE_API_ORIGIN: https://$VIRTUAL_HOST_API
      # Muss auf die Public-Albums-App (Port 3002) zeigen, nicht auf die Photos-App.
      # Achtung: aktuelle web-Images werten offiziell nur noch ENTE_API_ORIGIN aus,
      # massgeblich ist der apps:-Block in der museum.yaml. Hier zur Sicherheit belassen.
      ENTE_ALBUMS_ORIGIN: https://$VIRTUAL_HOST_ALBUMS
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"

      - "traefik.http.routers.ente-photos.entrypoints=websecure"
      - "traefik.http.routers.ente-photos.rule=Host(`$VIRTUAL_HOST_PHOTOS`)"
      - "traefik.http.routers.ente-photos.service=ente-photos"
      - "traefik.http.services.ente-photos.loadbalancer.server.port=3000"

      - "traefik.http.routers.ente-albums.entrypoints=websecure"
      - "traefik.http.routers.ente-albums.rule=Host(`$VIRTUAL_HOST_ALBUMS`)"
      - "traefik.http.routers.ente-albums.service=ente-albums"
      - "traefik.http.services.ente-albums.loadbalancer.server.port=3002"

      # Ente Locker - Dokumententresor
      - "traefik.http.routers.ente-locker.entrypoints=websecure"
      - "traefik.http.routers.ente-locker.rule=Host(`$VIRTUAL_HOST_LOCKER`)"
      - "traefik.http.routers.ente-locker.service=ente-locker"
      - "traefik.http.services.ente-locker.loadbalancer.server.port=3009"

      # Oeffentliche Locker-Freigabelinks (eigene App auf 3005)
      - "traefik.http.routers.ente-locker-share.entrypoints=websecure"
      - "traefik.http.routers.ente-locker-share.rule=Host(`$VIRTUAL_HOST_LOCKER_SHARE`)"
      - "traefik.http.routers.ente-locker-share.service=ente-locker-share"
      - "traefik.http.services.ente-locker-share.loadbalancer.server.port=3005"

      - "traefik.http.routers.ente-auth.entrypoints=websecure"
      - "traefik.http.routers.ente-auth.rule=Host(`$VIRTUAL_HOST_AUTH`)"
      - "traefik.http.routers.ente-auth.service=ente-auth"
      - "traefik.http.services.ente-auth.loadbalancer.server.port=3003"
    logging: *default-logging

  postgres:
    image: postgres:15
    restart: unless-stopped
    volumes:
      - "$CONTAINER_DIR/postgres:/var/lib/postgresql/data"
    environment:
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpass
      POSTGRES_DB: ente_db
    # Wait for postgres to accept connections before starting museum.
    healthcheck:
      test: ["CMD","pg_isready","-q","-d","ente_db","-U","pguser"]
      start_period: 30s
      start_interval: 1s
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # SILO - community fork of minio/minio (upstream stopped community releases).
  # Drop-in on S3-API, MINIO_* env vars und On-Disk-Format; Web-Console ist wieder drin.
  # Service heisst weiterhin "minio", damit socat/museum-Config unveraendert bleiben.
  minio:
    image: pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    command: server /data --address ":3200" --console-address ":3201"
    restart: unless-stopped
    networks: [traefik, default]
    volumes:
      - "$CONTAINER_DIR/minio:/data"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?}
      # Alias fuer den Healthcheck - wir laufen nicht auf dem Default-Port 9000,
      # daher taugt der eingebaute "local"-Alias von mc nicht.
      MC_HOST_local: http://${S3_ACCESS_KEY}:${S3_SECRET_KEY}@localhost:3200
    # Gilt erst als healthy, wenn der Server antwortet UND post_start die Buckets
    # angelegt hat. Damit kann museum nicht in einen leeren Store hineinstarten.
    healthcheck:
      test: ["CMD-SHELL", "mc ls local/b2-eu-cen >/dev/null 2>&1"]
      start_period: 60s
      start_interval: 2s
      interval: 30s
      timeout: 5s
      retries: 5
    post_start:
      - command: |
          sh -c '
          while ! mcli alias set h0 http://minio:3200 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" 2>/dev/null
          do
            echo "Waiting for silo..."
            sleep 0.5
          done

          cd /data

          mcli mb -p b2-eu-cen
          mcli mb -p wasabi-eu-central-2-v3
          mcli mb -p scw-eu-fr-v3
          '
    labels:
      # S3-API oeffentlich erreichbar machen: die presigned Upload-URLs, die museum
      # ausstellt, muessen vom Handy aus aufloesbar sein - nicht nur containerintern.
      # Die Console (3201) wird bewusst NICHT exponiert.
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"

      - "traefik.http.routers.ente-s3.entrypoints=websecure"
      - "traefik.http.routers.ente-s3.rule=Host(`$VIRTUAL_HOST_S3`)"
      - "traefik.http.routers.ente-s3.service=ente-s3"
      - "traefik.http.services.ente-s3.loadbalancer.server.port=3200"

      - "backup.enable=true"
      - "backup.password=$RESTIC_PASSWORD"
      - "backup.volumes=$CONTAINER_DIR/minio"
    logging: *default-logging

  backup:
    image: ghcr.io/nfrastack/db-backup:5
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - "$CONTAINER_DIR/db-backup:/backup"
    environment:
      - TIMEZONE=UTC
      - CONTAINER_ENABLE_MONITORING=FALSE
      - DEFAULT_LOG_LEVEL=WARN

      - DEFAULT_CREATE_LATEST_SYMLINK=TRUE
      - BACKUP_JOB_CONCURRENCY=1
      - DEFAULT_CHECKSUM=NONE
      - DEFAULT_COMPRESSION=NONE
      - DEFAULT_BACKUP_INTERVAL=1440
      - DEFAULT_BACKUP_BEGIN=0315
      - DEFAULT_CLEANUP_TIME=10080

      - DB01_TYPE=postgres
      - DB01_HOST=postgres
      - DB01_NAME=ente_db
      - DB01_USER=pguser
      - DB01_PASS=pgpass
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "backup.enable=true"
      - "backup.password=$RESTIC_PASSWORD"
      - "backup.volumes=$CONTAINER_DIR/db-backup"
    logging: *default-logging

networks:
  traefik:
    external: true
